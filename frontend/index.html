<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduAssist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>EduAssist</h1>
    <p>Your Smart Learning Companion</p>
</header>

<div class="main-wrapper">

    <!-- Chat Section -->
    <div class="section chat-wrapper">
        <h2>Ask any academic question</h2>
        <div id="chatbox" class="chatbox"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your question here...">
            <button onclick="sendMessage()">Send</button>
            <button onclick="startVoice()">🎤</button>
        </div>
    </div>

    <!-- Study Plan Section -->
    <div class="section study-wrapper">
        <h2>Create Study Plan</h2>
        <input type="date" id="examDate">
        <input type="text" id="subjects" placeholder="Subjects (comma separated)">
        <input type="number" id="hours" placeholder="Study hours per day">
        <button onclick="createStudyPlan()">Generate Plan</button>
        <div id="studyResult"></div>
    </div>

    <!-- Quiz Section -->
    <div class="section quiz-wrapper">
        <h2>AI Adaptive Quiz</h2>
        <button onclick="startQuiz()">Start Quiz</button>
        <div id="quizBox" class="quizbox" style="display:none;">
            <h3 id="quizQuestion"></h3>
            <div id="quizOptions"></div>
            <div id="quizFeedback"></div>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
